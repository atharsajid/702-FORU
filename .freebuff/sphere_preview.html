<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Category sphere preview</title>
<style>
  body { margin: 0; background: #F7F7FB; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  h2 { font: 700 12px/1.3 -apple-system, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #5B5B6B; margin: 0 0 16px; padding: 0 24px; }
  .row { display: flex; gap: 18px; padding: 0 24px 36px; align-items: flex-start; flex-wrap: wrap; }
  .cell { width: 118px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .ball { position: relative; border-radius: 50%; flex: none; }
  .photo { position: absolute; border-radius: 50%; overflow: hidden; background-size: cover; background-position: center; background-color: #8b8b96; }
  .sec { position: absolute; inset: 0; border-radius: 50%; }
  .label { font-size: 12px; font-weight: 600; line-height: 1.25; color: #16161F; text-align: center; }
</style>
</head>
<body>
  <div style="height:24px"></div>
  <h2>Phone (ball 75px)</h2>
  <div class="row" id="phone"></div>
  <h2>Detail (ball 260px)</h2>
  <div class="row" id="detail"></div>
  <h2>Rim probe — colour on the rim's mid-line at each hour</h2>
  <div class="row"><canvas id="probe" width="320" height="320"></canvas><pre id="probeOut"
    style="font:12px/1.5 ui-monospace,Menlo,monospace;color:#16161F;margin:0"></pre></div>

<script>
// ── Mirror of CategorySphere's maths (keep in sync with the Dart) ──────────
const RIM_RATIO = 0.085;              // CategorySphere._rimRatio
const GLOW_BLUR = 0.11, BLOOM_BLUR = 0.28;
const FLUTTER_TO_CSS_BLUR = 1.1547;   // cssBlur = 2 * sigma = blur / 0.57735

// AppColors.sphereRimGradient: LinearGradient(topRight → bottomLeft).
const RIM = [
  ['255,255,255', 0.00],
  ['247,241,255', 0.09],
  ['230,216,255', 0.22],
  ['207,174,255', 0.34],
  ['165,108,250', 0.47],
  ['131,64,224',  0.60],
  ['91,31,184',   0.74],
  ['69,21,138',   0.88],
  ['52,15,107',   1.00],
];
// LinearGradient(begin: Alignment(0.45,-1), end: Alignment(-0.45,1)).
// Corners of that gradient line, in % of the box:
const AXIS = { x0: 72.5, y0: 0, x1: 27.5, y1: 100 };
const RECESS = '43,15,94';        // AppColors.sphereRecess
const HILITE = '247,241,255';     // AppColors.sphereHighlight
const GLOW = '123,47,247', BLOOM = '168,85,247';

function ball(size, photoUrl) {
  const rim = size * RIM_RATIO;
  const inner = (size / 2 - rim) / (size / 2);   // photo radius, in radii
  const rimF = 1 - inner;                        // rim thickness, in radii

  // CSS pins the gradient to the box corners, Flutter pins it to the alignment
  // points, so remap the stops (css = 0.8293 * flutter + 0.0855) to match.
  const deg = (Math.atan2(AXIS.x1 - AXIS.x0, -(AXIS.y1 - AXIS.y0)) * 180 / Math.PI + 360) % 360;
  const remap = (s) => (0.8293 * s + 0.0855) * 100;
  const rimFill = `linear-gradient(${deg.toFixed(1)}deg, ` +
    RIM.map(([c, s]) => `rgb(${c}) ${remap(s).toFixed(1)}%`).join(', ') + `)`;

  // Sheen: radial, centred on the rim at 1.30 (Alignment(0.34, -0.34)).
  const sheenPos = '75% 25%';   // Alignment(0.5, -0.5): the rim at 1.30
  const sheen = `radial-gradient(circle ${(size * 0.24).toFixed(1)}px at ${sheenPos}, rgba(255,255,255,0.55), rgba(255,255,255,0))`;

  // Cross-section: recess under the overhang, lit lip, then the silhouette.
  const spread = `radial-gradient(circle closest-side at 50% 50%, ` + [
    `rgba(${RECESS},0) 0%`,
    `rgba(${RECESS},0) ${((inner - 0.09) * 100).toFixed(2)}%`,
    `rgba(${RECESS},0.30) ${((inner - 0.014) * 100).toFixed(2)}%`,
    `rgba(${RECESS},0.55) ${(inner * 100).toFixed(2)}%`,
    `rgba(${RECESS},0) ${((inner + rimF * 0.10) * 100).toFixed(2)}%`,
    `rgba(255,255,255,0.60) ${((inner + rimF * 0.18) * 100).toFixed(2)}%`,
    `rgba(255,255,255,0) ${((inner + rimF * 0.55) * 100).toFixed(2)}%`,
    `rgba(${RECESS},0.06) ${((inner + rimF * 0.80) * 100).toFixed(2)}%`,
    `rgba(${RECESS},0.14) 100%`,
  ].join(', ') + `)`;

  const el = document.createElement('div');
  el.className = 'ball';
  el.style.cssText = `width:${size}px;height:${size}px;background:${rimFill};` +
    `box-shadow: 0 0 ${(size * GLOW_BLUR * FLUTTER_TO_CSS_BLUR).toFixed(1)}px ${(size * 0.01).toFixed(1)}px rgba(${GLOW},0.60),` +
    ` 0 0 ${(size * BLOOM_BLUR * FLUTTER_TO_CSS_BLUR).toFixed(1)}px ${(size * 0.022).toFixed(1)}px rgba(${BLOOM},0.25);`;
  el.innerHTML =
    `<div class="sec" style="background:${sheen}"></div>` +
    `<div class="photo" style="inset:${rim.toFixed(2)}px;background-image:url('${photoUrl}')">` +
      `<div class="sec" style="background:linear-gradient(to bottom left, rgba(${RECESS},0) 0% 50%, rgba(${RECESS},0.32) 100%)"></div>` +
    `</div>` +
    `<div class="sec" style="background:${spread}"></div>`;
  return el;
}

const PHOTOS = [
  ['Arts &amp; Culture', 'https://images.pexels.com/photos/1674049/pexels-photo-1674049.jpeg?auto=compress&cs=tinysrgb&w=300'],
  ['Food &amp; Drink',   'https://images.pexels.com/photos/315755/pexels-photo-315755.jpeg?auto=compress&cs=tinysrgb&w=300'],
  ['Nightlife &amp; Entertainment', 'https://images.pexels.com/photos/164821/pexels-photo-164821.jpeg?auto=compress&cs=tinysrgb&w=300'],
];

const phone = document.getElementById('phone');
PHOTOS.forEach(([label, url]) => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.appendChild(ball(75, url));
  cell.insertAdjacentHTML('beforeend', `<div class="label">${label}</div>`);
  phone.appendChild(cell);
});

const detail = document.getElementById('detail');
PHOTOS.forEach(([, url]) => detail.appendChild(ball(260, url)));

// ── Objective probe: sample the same gradients via canvas at each hour ──────
(function probe() {
  const S = 300, R = S / 2;
  const rim = S * RIM_RATIO;
  const inner = (R - rim) / R, rimF = 1 - inner;
  const c = document.getElementById('probe');
  const g = c.getContext('2d');
  const cx = R, cy = R;

  // Sheen, over the rim only (photo would cover the middle in the app).
  const sheen = g.createRadialGradient(cx + 0.5 * R, cy - 0.5 * R, 0, cx + 0.5 * R, cy - 0.5 * R, S * 0.24);
  sheen.addColorStop(0, 'rgba(255,255,255,0.55)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sheen;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

  // Cross-section (the app paints this over photo + rim alike).
  const rimBg = g.createLinearGradient(S * AXIS.x0 / 100, S * AXIS.y0 / 100, S * AXIS.x1 / 100, S * AXIS.y1 / 100);
  RIM.forEach(([col, s]) => rimBg.addColorStop(s, `rgb(${col})`));
  g.fillStyle = rimBg;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

  const rg = g.createRadialGradient(cx, cy, 0, cx, cy, R);
  rg.addColorStop(0, `rgba(${RECESS},0)`);
  rg.addColorStop(inner - 0.09, `rgba(${RECESS},0)`);
  rg.addColorStop(inner - 0.014, `rgba(${RECESS},0.30)`);
  rg.addColorStop(inner, `rgba(${RECESS},0.55)`);
  rg.addColorStop(inner + rimF * 0.10, `rgba(${RECESS},0)`);
  rg.addColorStop(inner + rimF * 0.18, 'rgba(255,255,255,0.60)');
  rg.addColorStop(inner + rimF * 0.55, 'rgba(255,255,255,0)');
  rg.addColorStop(inner + rimF * 0.80, `rgba(${RECESS},0.06)`);
  rg.addColorStop(1, `rgba(${RECESS},0.14)`);
  g.fillStyle = rg;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();

  const lines = [];
  let peak = { lum: -1 }, trough = { lum: 999 };
  for (let deg = 0; deg < 360; deg += 15) {
    const a = deg * Math.PI / 180 - Math.PI / 2;            // clockwise from the top
    const rMid = R - rim / 2, rIn = R * (inner + rimF * 0.18), rOut = R * (inner + rimF * 0.90);
    const at = (r) => {
      const d = g.getImageData(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1).data;
      return { hex: '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join(''), lum: 0.2126 * d[0] + 0.7152 * d[1] + 0.0722 * d[2] };
    };
    const mid = at(rMid), edge = at(rOut), lip = at(rIn);
    if (mid.lum > peak.lum) peak = { ...mid, deg };
    if (mid.lum < trough.lum) trough = { ...mid, deg };
    const h = deg / 30, clock = `${h === 0 ? 12 : Math.floor(h)}:${deg % 30 ? '30' : '00'}`;
    lines.push(`${clock.padEnd(6)} mid ${mid.hex} ${mid.lum.toFixed(0).padStart(3)}   lip ${lip.hex}   edge ${edge.hex} ${edge.lum.toFixed(0).padStart(3)}`);
  }
  lines.unshift(`peak ${peak.hex} (lum ${peak.lum.toFixed(0)}) at ${peak.deg}°  |  trough ${trough.hex} (lum ${trough.lum.toFixed(0)}) at ${trough.deg}°`, '');
  document.getElementById('probeOut').textContent = lines.join('\n');
  window.probe = () => lines;
})();
</script>
</body>
</html>
